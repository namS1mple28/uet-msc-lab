name: Kiểm tra file dựng khớp file nguồn

# Bốn trang HTML là file sinh tự động. Job dựng lại, so sánh output, chạy
# numerical fixtures và browser regression để phát hiện thay đổi thiếu nhất quán.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Kiểm tra thuật toán và nhập dữ liệu
        run: npm test

      - name: Dựng lại từ file nguồn
        run: python build.py

      - name: So sánh với file đã commit
        run: |
          if ! git diff --quiet -- index.html vat-lieu.html nguyen-tu.html analysis.html; then
            echo "::error::File đã dựng không khớp src/msc-lab.html."
            echo "Chạy 'python3 build.py' rồi commit lại bốn file HTML."
            echo "--- khác biệt ---"
            git diff --stat -- index.html vat-lieu.html nguyen-tu.html analysis.html
            exit 1
          fi
          echo "Bốn trang khớp với file nguồn."

      - name: Kiểm tra nhanh từng trang
        run: |
          set -e
          for f in index.html vat-lieu.html nguyen-tu.html; do
            test -s "$f" || { echo "::error::Thiếu $f"; exit 1; }
            grep -q "__MSC_PAGE" "$f" || { echo "::error::$f không có cờ trang"; exit 1; }
            if grep -q "__URL_" "$f"; then echo "::error::$f còn placeholder chưa thay"; exit 1; fi
            echo "$f — $(wc -c < "$f") byte"
          done
          test -s analysis.html

      - name: Cài browser kiểm thử
        run: npx playwright install --with-deps chromium firefox

      - name: Kiểm thử tương tác và xuất figure
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
